<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 168" width="1200" height="168" role="img"><title>Python Lab</title><desc>Python Lab card: twin blue and gold ribbons beside a code window running print("hello, lab").</desc>
<defs><style type="text/css"><![CDATA[
@keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
@keyframes dash { to { stroke-dashoffset: -180 } }
@keyframes drift { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
.cur { animation: blink 1.1s steps(1) infinite }
.dash { stroke-dasharray: 8 12; animation: dash 7s linear infinite }
.bob { animation: drift 4.5s ease-in-out infinite }
@media (prefers-reduced-motion: reduce) { .cur, .dash, .bob { animation: none } }
]]></style>
<linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b3d"/><stop offset=".55" stop-color="#0a1024"/><stop offset="1" stop-color="#1a1604"/></linearGradient>
<radialGradient id="pgl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#4b8bbe" stop-opacity=".55"/><stop offset="1" stop-color="#4b8bbe" stop-opacity="0"/></radialGradient>
<radialGradient id="pgy" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd43b" stop-opacity=".35"/><stop offset="1" stop-color="#ffd43b" stop-opacity="0"/></radialGradient>
<linearGradient id="pb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fc1ee"/><stop offset="1" stop-color="#2f6aa3"/></linearGradient>
<linearGradient id="py" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff0a0"/><stop offset="1" stop-color="#f0b400"/></linearGradient>
</defs>
<rect x="10" y="14" width="1172" height="140" rx="18" fill="#0a0f06"/><rect x="4" y="6" width="1172" height="140" rx="18" fill="url(#pbg)" stroke="#ffd43b" stroke-opacity=".8" stroke-width="1.5"/>
<g transform="translate(96 84)"><g transform="scale(1.0)"><circle r="46" fill="url(#pgl)"/><circle r="46" fill="url(#pgy)" transform="translate(10 12)"/>
<circle r="34" fill="#070d1e" stroke="#ffd43b" stroke-opacity=".8" stroke-width="2"/><circle r="42" fill="none" stroke="#4b8bbe" stroke-opacity=".6" stroke-width="1.4" class="dash"/>
<g class="bob" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M-8 -22 C-24 -22 -24 -4 -8 -4 L8 -4" stroke="url(#pb)" stroke-width="9"/>
<path d="M8 22 C24 22 24 4 8 4 L-8 4" stroke="url(#py)" stroke-width="9"/>
<path d="M-8 -22 L6 -22" stroke="url(#pb)" stroke-width="9"/><path d="M8 22 L-6 22" stroke="url(#py)" stroke-width="9"/></g>
<circle cx="-11" cy="-22" r="2" fill="#071022"/><circle cx="11" cy="22" r="2" fill="#2a1d00"/></g></g>
<text x="176" y="74" fill="#f4f7fb" font-size="28" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Python Lab</text><text x="176" y="114" fill="#d5dce6" font-size="20" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Python that runs in the browser.</text>
<g transform="translate(800 22)"><rect width="330" height="110" rx="10" fill="#060b19" stroke="#4b8bbe" stroke-opacity=".55"/><rect width="330" height="22" rx="10" fill="#0f1a35"/><rect y="13.2" width="330" height="8.8" fill="#0f1a35"/><circle cx="12.100000000000001" cy="11" r="3.52" fill="#ff6b6b"/><circle cx="24.75" cy="11" r="3.52" fill="#ffd43b"/><circle cx="37.4" cy="11" r="3.52" fill="#6ee7b7"/><text x="319" y="14.3" text-anchor="end" fill="#6b7ba6" font-size="9.35" font-family="ui-monospace,SFMono-Regular,'Fira Code',Consolas,'Courier New',monospace">main.py</text><text x="11" y="37.4" font-size="11.55" font-family="ui-monospace,SFMono-Regular,'Fira Code',Consolas,'Courier New',monospace" xml:space="preserve"><tspan fill="#ffd43b">>>> </tspan><tspan fill="#c792ea">import </tspan><tspan fill="#d6e0ff">this</tspan></text><text x="11" y="58.3" font-size="11.55" font-family="ui-monospace,SFMono-Regular,'Fira Code',Consolas,'Courier New',monospace" xml:space="preserve"><tspan fill="#ffd43b">>>> </tspan><tspan fill="#82aaff">print</tspan><tspan fill="#d6e0ff">(</tspan><tspan fill="#a5e075">"hello, lab"</tspan><tspan fill="#d6e0ff">)</tspan></text><text x="11" y="79.19999999999999" font-size="11.55" font-family="ui-monospace,SFMono-Regular,'Fira Code',Consolas,'Courier New',monospace" xml:space="preserve"><tspan fill="#4b8bbe">hello, lab</tspan></text><text x="11" y="100.1" font-size="11.55" font-family="ui-monospace,SFMono-Regular,'Fira Code',Consolas,'Courier New',monospace" xml:space="preserve"><tspan fill="#ffd43b">>>> </tspan></text>
<rect class="cur" x="39.72" y="90.1" width="7" height="13" fill="#ffd43b"/></g>
</svg>