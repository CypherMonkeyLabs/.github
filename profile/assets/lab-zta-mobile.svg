<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 208" width="640" height="208" role="img">
<title>Zoom, Talkdesk and Avaya Lab</title>
<defs>
<style type="text/css"><![CDATA[
@keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
@keyframes dash { to { stroke-dashoffset: -180 } }
.pulse { animation: pulse 2.8s ease-in-out infinite }
.dash { stroke-dasharray: 8 12; animation: dash 7s linear infinite }
@media (prefers-reduced-motion: reduce) {
  .pulse, .dash { animation: none }
}
]]></style>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="3.2" result="b"/>
